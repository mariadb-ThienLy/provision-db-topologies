# EM UI registration metadata (for Playwright tests):
#   Topology:       Standalone server                      (mema-agent)
#   Database name:  standalone-docker
#   Server name:    standalone-server
#   Address:        127.0.0.1
#   Port:           3306
#   User:           root
#   Password:       mariadb
#
#  Topology:       Primary/Replica
#   Database name:  primary-replica-docker
#   Servers:
#     - primary    127.0.0.1:3307  root / mariadb         (mema-agent)
#     - replica    127.0.0.1:3308  root / mariadb
#
#   Topology:       Galera Cluster
#   Database name:  galera-docker
#   Servers:
#     - galera-1   127.0.0.1:3309  root / mariadb
#     - galera-2   127.0.0.1:3310  root / mariadb
#     - galera-3   127.0.0.1:3311  root / mariadb
#
#   Topology:       Primary/Replica with MaxScale
#   Database name:  primary-replica-maxscale-docker
#   Server (registered in EM as the MaxScale REST API):
#     - maxscale_1 127.0.0.1:8989  admin / mariadb        (mema-agent)
#   (Backends auto-discovered by EM via MaxScale: mxs-server-1, mxs-server-2,
#    plus mxs-server-3 — a dummy backend pointed at the RFC 5737 TEST-NET-3
#    address 192.0.2.3:3314 that is always Down, used to exercise EM's
#    handling of an unreachable backend.
#    SQL listener exposed on 127.0.0.1:4006 for direct client traffic.)

# Custom image with the `mema-agent` deb preinstalled, used by the two
# servers that exercise the agent registration path (`standalone` and
# `primary`). The wrapper entrypoint (provision/mema-entrypoint.sh)
# starts mariadbd, runs `mema-agent setup --skip-start` once using the
# MEMA_* env vars below, then runs `mema-agent run --verbose` in the
# foreground. ENTERPRISE_TOKEN is consumed at build time only and
# scrubbed from the resulting image. No explicit image tag is set —
# compose auto-names each as `<project>-<service>`, sharing layers via
# BuildKit cache. The other four services (`replica` + galera nodes)
# run plain `mariadb:11`; EM auto-discovers the replica via
# `SHOW SLAVE HOSTS` and the Galera test only needs the cluster row to
# land.
x-mariadb-mema: &mariadb-mema
  build:
    context: ./provision
    dockerfile: Dockerfile.mariadb-mema
    args:
      ENTERPRISE_TOKEN: ${ENTERPRISE_TOKEN}

# Env values for the two mema-agent services (`standalone` and
# `primary`). Merged into their `environment:` via `<<:`.
# `MEMA_HOSTNAME` comes from `.env` (e.g. https://192.168.1.116:8090);
# the entrypoint strips the trailing :port to derive the agent
# endpoint.
x-mema-env: &mema-env
  MARIADB_ROOT_PASSWORD: mariadb
  MEMA_HOSTNAME: ${MEMA_HOSTNAME}

configs:
  primary-init:
    content: |
      CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY 'replpw';
      GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
      RESET MASTER;
  replica-init:
    # Replica reaches primary via service-name DNS on db-net.
    content: |
      CHANGE MASTER TO
        MASTER_HOST='primary',
        MASTER_PORT=3307,
        MASTER_USER='repl',
        MASTER_PASSWORD='replpw',
        MASTER_USE_GTID=slave_pos;
      START SLAVE;
  galera-init:
    # Created on galera-1 during bootstrap; galera-2/3 receive it via SST.
    content: |
      CREATE USER IF NOT EXISTS 'mariabackup'@'%' IDENTIFIED BY 'backuppw';
      GRANT RELOAD, PROCESS, LOCK TABLES, BINLOG MONITOR ON *.* TO 'mariabackup'@'%';
  galera-entrypoint:
    # Smart entrypoint mounted on all three galera nodes. Decides whether to
    # add `--wsrep-new-cluster` based on grastate.dat, so any node that was
    # last to stop cleanly can bootstrap on the next `up`.
    file: ./provision/galera-entrypoint.sh
  mxs-server-1-init:
    # admin@'%' is created AFTER `RESET MASTER` so it lands in the fresh
    # binlog and replicates to mxs-server-2 when START SLAVE runs there —
    # MaxScale's monitor needs admin credentials on both backends.
    content: |
      CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY 'replpw';
      GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
      RESET MASTER;
      CREATE USER IF NOT EXISTS 'admin'@'%' IDENTIFIED BY 'mariadb';
      GRANT ALL PRIVILEGES ON *.* TO 'admin'@'%' WITH GRANT OPTION;
  mxs-server-2-init:
    # Replica reaches primary by service-name DNS on mxs-net.
    content: |
      CHANGE MASTER TO
        MASTER_HOST='mxs-server-1',
        MASTER_PORT=3312,
        MASTER_USER='repl',
        MASTER_PASSWORD='replpw',
        MASTER_USE_GTID=slave_pos;
      START SLAVE;
  maxscale-cnf:
    # mariadbmon + readwritesplit. Backends reached by service-name DNS on
    # mxs-net. admin/mariadb matches the user seeded by mxs-server-1-init.
    # admin_oidc_* points at the EM origin (MEMA_HOSTNAME from .env) so the
    # MaxScale GUI can SSO against EM as the `admin` service account.
    # Shared by both `maxscale` and `maxscale-2`. Both monitors carry the same
    # name and `cooperative_monitoring_locks`, so the two instances elect a
    # single active monitor and only one runs auto_failover/auto_rejoin.
    content: |
      [maxscale]
      threads=auto
      admin_host=0.0.0.0
      admin_port=8989
      admin_secure_gui=false
      admin_oidc_url=${MEMA_HOSTNAME}
      admin_oidc_client_id=admin
      admin_oidc_client_secret=mariadb
      admin_oidc_ssl_insecure=true

      [mxs-server-1]
      type=server
      address=mxs-server-1
      port=3312
      protocol=MariaDBBackend

      [mxs-server-2]
      type=server
      address=mxs-server-2
      port=3313
      protocol=MariaDBBackend

      # Dummy backend with no matching service — points at an RFC 5737
      # TEST-NET-3 address that is guaranteed unroutable, so mariadbmon
      # always reports it as Down. Used to exercise EM's handling of an
      # unreachable backend in a MaxScale topology.
      [mxs-server-3]
      type=server
      address=192.0.2.3
      port=3314
      protocol=MariaDBBackend

      [MariaDB-Monitor]
      type=monitor
      module=mariadbmon
      servers=mxs-server-1,mxs-server-2,mxs-server-3
      user=admin
      password=mariadb
      monitor_interval=2000ms
      auto_failover=true
      auto_rejoin=true
      cooperative_monitoring_locks=majority_of_running

      [Read-Write-Service]
      type=service
      router=readwritesplit
      servers=mxs-server-1,mxs-server-2,mxs-server-3
      user=admin
      password=mariadb

      [Read-Write-Listener]
      type=listener
      service=Read-Write-Service
      protocol=MariaDBClient
      address=0.0.0.0
      port=4006
  keycloak-realm:
    # Imported on first start via `--import-realm` (IGNORE_EXISTING — re-runs
    # are no-ops). The wrapper entrypoint expands `${MEMA_HOSTNAME}` before
    # kc.sh starts, since Keycloak's own substitution doesn't apply to realm JSON.
    file: ./provision/keycloak-realm.json
  keycloak-entrypoint:
    file: ./provision/keycloak-entrypoint.sh
    
networks:
  # Standalone + primary/replica. Bridge gives each container its own
  # private 127.0.0.1, so the two mema-agents (standalone, primary) can
  # bind their default exporter ports (:18901 / :18902) without
  # clashing on the host.
  db-net:
    driver: bridge
  galera-net:
    driver: bridge
  mxs-net:
    driver: bridge

volumes:
  standalone-data:
    name: enterprise-manager-standalone
  primary-data:
    name: enterprise-manager-primary
  replica-data:
    name: enterprise-manager-replica
  galera-1-data:
    name: enterprise-manager-galera-1
  galera-2-data:
    name: enterprise-manager-galera-2
  galera-3-data:
    name: enterprise-manager-galera-3
  mxs-server-1-data:
    name: enterprise-manager-mxs-server-1
  mxs-server-2-data:
    name: enterprise-manager-mxs-server-2
  # Fallback target for the supermax GUI mount when `SUPERMAX_GUI_DIR` is
  # unset. On first start docker auto-populates this empty volume from the
  # image's `/usr/share/supermax/gui`, so the container runs the original
  # GUI shipped in the image. The volume caches that initial copy — after
  # a supermax image upgrade, run
  # `docker volume rm enterprise-manager-supermax-original-gui` to refresh.
  supermax-original-gui:
    name: enterprise-manager-supermax-original-gui

services:
  # Mount strategy for the supermax GUI:
  #   - `SUPERMAX_GUI_DIR` set in .env  → bind-mount that host path (e.g.
  #     the `dist/` produced by `vite build` in enterprise-manager-frontend),
  #     so E2E tests run against a custom frontend revision. Read-only so
  #     the container can't write back; subsequent `vite build` runs are
  #     reflected on the next page reload — no container restart needed.
  #   - `SUPERMAX_GUI_DIR` unset       → use the `supermax-original-gui`
  #     named volume, which auto-populates from the image's baked-in GUI on
  #     first start. The variable is fully optional (no override required
  #     in CI defaults).
  supermax:
    volumes:
      - ${SUPERMAX_GUI_DIR:-supermax-original-gui}:/usr/share/supermax/gui:ro

  standalone:
    <<: *mariadb-mema
    container_name: enterprise-manager-standalone
    networks: [db-net]
    ports:
      - '127.0.0.1:3306:3306'
    restart: always
    volumes:
      - standalone-data:/var/lib/mysql
    environment:
      <<: *mema-env
      MEMA_CLUSTER_NAME: standalone-docker
      MEMA_HOST_NAME: standalone-docker@standalone-server
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect']
      interval: 5s
      retries: 20
      start_period: 30s

  primary:
    <<: *mariadb-mema
    container_name: enterprise-manager-primary
    networks: [db-net]
    ports:
      - '127.0.0.1:3307:3307'
    restart: always
    volumes:
      - primary-data:/var/lib/mysql
    command: >-
      --port=3307
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
    environment:
      <<: *mema-env
      MEMA_CLUSTER_NAME: primary-replica-docker
      MEMA_HOST_NAME: primary-replica-docker@primary
      MEMA_DB_PORT: '3307'
    configs:
      - source: primary-init
        target: /docker-entrypoint-initdb.d/99-replication-user.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect']
      interval: 5s
      retries: 30
      start_period: 30s

  replica:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-replica
    networks: [db-net]
    ports:
      - '127.0.0.1:3308:3308'
    restart: always
    volumes:
      - replica-data:/var/lib/mysql
    depends_on:
      primary:
        condition: service_healthy
    command: >-
      --port=3308
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --report-host=replica
      --report-port=3308
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    configs:
      - source: replica-init
        target: /docker-entrypoint-initdb.d/99-start-replication.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect']
      interval: 5s
      retries: 30
      start_period: 30s

  galera-1:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-galera-1
    restart: always
    # Give Galera time to coordinate a clean shutdown on OS reboot. Without
    # this, dockerd's default 10s SIGTERM-to-SIGKILL window often kills
    # mariadbd before it writes `safe_to_bootstrap: 1` on the last surviving
    # node — leading to all nodes coming back with seqno=-1 after boot.
    stop_grace_period: 60s
    networks: [galera-net]
    ports:
      - '127.0.0.1:3309:3306'
    volumes:
      - galera-1-data:/var/lib/mysql
    entrypoint: /usr/local/bin/galera-entrypoint.sh
    command: >-
      mariadbd
      --wsrep_on=ON
      --wsrep_provider=/usr/lib/galera/libgalera_smm.so
      --wsrep_cluster_name=test-cluster
      --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
      --wsrep_sst_method=mariabackup
      --wsrep_sst_auth=mariabackup:backuppw
      --wsrep_node_name=galera-1
      --wsrep_node_address=galera-1
      --wsrep_node_incoming_address=127.0.0.1:3309
      --server-id=1
      --bind-address=0.0.0.0
      --default-storage-engine=InnoDB
      --innodb_autoinc_lock_mode=2
      --log-bin=mysql-bin
      --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      # Only galera-1 force-bootstraps when no node has any state yet (fresh
      # volumes). On subsequent restarts the entrypoint defers to grastate.dat.
      GALERA_PREFER_BOOTSTRAP: '1'
    configs:
      - source: galera-init
        target: /docker-entrypoint-initdb.d/99-mariabackup-user.sql
      - source: galera-entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -uroot -pmariadb -BNs -e "SHOW STATUS LIKE 'wsrep_ready'" | grep -q ON
      interval: 5s
      retries: 30
      start_period: 60s

  galera-2:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-galera-2
    restart: always
    stop_grace_period: 60s
    networks: [galera-net]
    ports:
      - '127.0.0.1:3310:3306'
    volumes:
      - galera-2-data:/var/lib/mysql
    # service_started (not service_healthy): if galera-1's grastate.dat says it
    # can't bootstrap, it'll wait for a peer — gating galera-2 on its health
    # would deadlock. Whichever node has safe_to_bootstrap=1 wins.
    depends_on:
      galera-1:
        condition: service_started
    entrypoint: /usr/local/bin/galera-entrypoint.sh
    command: >-
      mariadbd
      --wsrep_on=ON
      --wsrep_provider=/usr/lib/galera/libgalera_smm.so
      --wsrep_cluster_name=test-cluster
      --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
      --wsrep_sst_method=mariabackup
      --wsrep_sst_auth=mariabackup:backuppw
      --wsrep_node_name=galera-2
      --wsrep_node_address=galera-2
      --wsrep_node_incoming_address=127.0.0.1:3310
      --server-id=2
      --bind-address=0.0.0.0
      --default-storage-engine=InnoDB
      --innodb_autoinc_lock_mode=2
      --log-bin=mysql-bin
      --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    configs:
      - source: galera-entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -uroot -pmariadb -BNs -e "SHOW STATUS LIKE 'wsrep_ready'" | grep -q ON
      interval: 5s
      retries: 30
      start_period: 60s

  galera-3:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-galera-3
    restart: always
    stop_grace_period: 60s
    networks: [galera-net]
    ports:
      - '127.0.0.1:3311:3306'
    volumes:
      - galera-3-data:/var/lib/mysql
    # See galera-2 note on service_started.
    depends_on:
      galera-1:
        condition: service_started
    entrypoint: /usr/local/bin/galera-entrypoint.sh
    command: >-
      mariadbd
      --wsrep_on=ON
      --wsrep_provider=/usr/lib/galera/libgalera_smm.so
      --wsrep_cluster_name=test-cluster
      --wsrep_cluster_address=gcomm://galera-1,galera-2,galera-3
      --wsrep_sst_method=mariabackup
      --wsrep_sst_auth=mariabackup:backuppw
      --wsrep_node_name=galera-3
      --wsrep_node_address=galera-3
      --wsrep_node_incoming_address=127.0.0.1:3311
      --server-id=3
      --bind-address=0.0.0.0
      --default-storage-engine=InnoDB
      --innodb_autoinc_lock_mode=2
      --log-bin=mysql-bin
      --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    configs:
      - source: galera-entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -uroot -pmariadb -BNs -e "SHOW STATUS LIKE 'wsrep_ready'" | grep -q ON
      interval: 5s
      retries: 30
      start_period: 60s

 # Primary/Replica fronted by MaxScale 25.10.2 (mema-agent on the
  # MaxScale node, not on the servers). EM registers the MaxScale REST
  # API on :8989 and auto-discovers the servers. Servers find each
  # other by service-name DNS on mxs-net; mariadbmon takes care of
  # promoting the primary and tracking the replica.
  mxs-server-1:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-mxs-server-1
    restart: always
    networks: [mxs-net]
    ports:
      - '127.0.0.1:3312:3312'
    volumes:
      - mxs-server-1-data:/var/lib/mysql
    command: >-
      --port=3312
      --server-id=11
      --log-bin=mysql-bin
      --binlog-format=ROW
      --report-host=mxs-server-1
      --report-port=3312
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    configs:
      - source: mxs-server-1-init
        target: /docker-entrypoint-initdb.d/99-replication-and-admin.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect']
      interval: 5s
      retries: 30
      start_period: 30s

  mxs-server-2:
    build:
      dockerfile_inline: |
        FROM mariadb:11
    container_name: enterprise-manager-mxs-server-2
    restart: always
    networks: [mxs-net]
    ports:
      - '127.0.0.1:3313:3313'
    volumes:
      - mxs-server-2-data:/var/lib/mysql
    depends_on:
      mxs-server-1:
        condition: service_healthy
    command: >-
      --port=3313
      --server-id=12
      --log-bin=mysql-bin
      --binlog-format=ROW
      --report-host=mxs-server-2
      --report-port=3313
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    configs:
      - source: mxs-server-2-init
        target: /docker-entrypoint-initdb.d/99-start-replication.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect']
      interval: 5s
      retries: 30
      start_period: 30s

  maxscale:
    build:
      context: ./provision
      dockerfile: Dockerfile.maxscale-mema
      args:
        ENTERPRISE_TOKEN: ${ENTERPRISE_TOKEN}
    container_name: enterprise-manager-maxscale
    restart: always
    networks: [mxs-net]
    ports:
      - '127.0.0.1:4006:4006'
      - '127.0.0.1:8989:8989'
    depends_on:
      mxs-server-1:
        condition: service_healthy
      mxs-server-2:
        condition: service_healthy
    environment:
      MEMA_HOSTNAME: ${MEMA_HOSTNAME}
      MEMA_CLUSTER_NAME: primary-replica-maxscale-docker
      MEMA_HOST_NAME: primary-replica-maxscale-docker@maxscale_1
    configs:
      - source: maxscale-cnf
        target: /etc/maxscale.cnf
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf -o /dev/null -u admin:mariadb http://127.0.0.1:8989/v1/maxscale || exit 1
      interval: 10s
      retries: 30
      start_period: 60s

  # A second, bare MaxScale fronting the same backends as `maxscale`, exposed
  # on different host ports (SQL 4007, REST/GUI 8999). No mema-agent runs and
  # it is not registered in EM. It shares the `maxscale-cnf` config — inside
  # its own network namespace it still listens on 8989/4006, so only the
  # published ports differ. The image's entrypoint also starts the agent, so
  # it's overridden here to run MaxScale alone; the override first recreates
  # /run/maxscale (the runtime dir the wrapper sets up, lost because /run is a
  # fresh tmpfs), then execs maxscale so SIGTERM reaches it for clean shutdown.
  maxscale-2:
    build:
      context: ./provision
      dockerfile: Dockerfile.maxscale-mema
      args:
        ENTERPRISE_TOKEN: ${ENTERPRISE_TOKEN}
    container_name: enterprise-manager-maxscale-2
    restart: always
    networks: [mxs-net]
    ports:
      - '127.0.0.1:4007:4006'
      - '127.0.0.1:8999:8989'
    depends_on:
      mxs-server-1:
        condition: service_healthy
      mxs-server-2:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - install -d -m 0755 -o maxscale -g maxscale /run/maxscale && exec maxscale --user=maxscale --nodaemon
    configs:
      - source: maxscale-cnf
        target: /etc/maxscale.cnf
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf -o /dev/null -u admin:mariadb http://127.0.0.1:8989/v1/maxscale || exit 1
      interval: 10s
      retries: 30
      start_period: 60s

  keycloak:
      image: quay.io/keycloak/keycloak
      restart: always
      ports:
          - 8080:8080
      environment:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
          # Substituted into `${MEMA_HOSTNAME}` placeholders in the realm template
          # by the wrapper entrypoint before kc.sh runs.
          MEMA_HOSTNAME: ${MEMA_HOSTNAME}
      entrypoint: ['sh', '/usr/local/bin/keycloak-entrypoint.sh']
      command: start-dev --import-realm
      configs:
          - source: keycloak-realm
            target: /tmp/keycloak-realm.json
          - source: keycloak-entrypoint
            target: /usr/local/bin/keycloak-entrypoint.sh
