# Aggregate stack: every DB topology EM's Playwright suite registers against.
#
# Each topology lives in its own file under topologies/ to keep it readable;
# this root file `include:`s them so the whole stack comes up together. Always
# run it as a whole — `docker compose up` here — not file-by-file: the suite
# expects every topology present, and an individual `-f topologies/<x>.yml` run
# resolves `.env` relative to topologies/ (where there is none). Per-topology EM
# UI registration metadata lives in each included file's header.
include:
  - topologies/standalone.yml
  - topologies/primary-replica.yml
  - topologies/galera.yml
  - topologies/primary-replica-maxscale.yml
  - topologies/keycloak.yml
